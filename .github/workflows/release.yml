name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Stamp version and URLs into module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          export VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const { VERSION, REPO, TAG } = process.env;
            m.version = VERSION;
            m.url = `https://github.com/${REPO}`;
            m.bugs = `https://github.com/${REPO}/issues`;
            m.manifest = `https://github.com/${REPO}/releases/latest/download/module.json`;
            m.download = `https://github.com/${REPO}/releases/download/${TAG}/sfk.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            dist/sfk.zip
